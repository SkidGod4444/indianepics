<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" role="img" aria-label="Wave"><title>Wave</title><desc>A breathing sine wave drifts left to right.</desc><defs><circle id="glyph-wave-b" r="2.4" fill="#ffffff" opacity="0.07"/><circle id="glyph-wave-l" r="3.1"/></defs><style>.glyph-wave-l{fill:#ffffff;opacity:0;animation:glyph-wave-k 2400ms cubic-bezier(0.65, 0, 0.35, 1) infinite both;}@keyframes glyph-wave-k{0%{opacity:0.05;}20%{opacity:1;}55%{opacity:0.18;}100%{opacity:0.05;}}@media (prefers-reduced-motion:reduce){.glyph-wave-l{animation:none;opacity:0.45;}}.glyph-wave-d0{animation-delay:0ms;}.glyph-wave-d1{animation-delay:480ms;}.glyph-wave-d2{animation-delay:960ms;}.glyph-wave-d3{animation-delay:1440ms;}.glyph-wave-d4{animation-delay:1920ms;}.glyph-wave-d5{animation-delay:48ms;}.glyph-wave-d6{animation-delay:528ms;}.glyph-wave-d7{animation-delay:1008ms;}.glyph-wave-d8{animation-delay:1488ms;}.glyph-wave-d9{animation-delay:1968ms;}.glyph-wave-d10{animation-delay:96ms;}.glyph-wave-d11{animation-delay:576ms;}.glyph-wave-d12{animation-delay:1056ms;}.glyph-wave-d13{animation-delay:1536ms;}.glyph-wave-d14{animation-delay:2016ms;}.glyph-wave-d15{animation-delay:144ms;}.glyph-wave-d16{animation-delay:624ms;}.glyph-wave-d17{animation-delay:1104ms;}.glyph-wave-d18{animation-delay:1584ms;}.glyph-wave-d19{animation-delay:2064ms;}.glyph-wave-d20{animation-delay:192ms;}.glyph-wave-d21{animation-delay:672ms;}.glyph-wave-d22{animation-delay:1152ms;}.glyph-wave-d23{animation-delay:1632ms;}.glyph-wave-d24{animation-delay:2112ms;}</style><use href="#glyph-wave-b" x="6" y="6"/><use href="#glyph-wave-b" x="17" y="6"/><use href="#glyph-wave-b" x="28" y="6"/><use href="#glyph-wave-b" x="39" y="6"/><use href="#glyph-wave-b" x="50" y="6"/><use href="#glyph-wave-b" x="6" y="17"/><use href="#glyph-wave-b" x="17" y="17"/><use href="#glyph-wave-b" x="28" y="17"/><use href="#glyph-wave-b" x="39" y="17"/><use href="#glyph-wave-b" x="50" y="17"/><use href="#glyph-wave-b" x="6" y="28"/>