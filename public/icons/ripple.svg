<svg xmlns="http://www.w3.org/2000/svg" aria-label="Ripple" role="img" viewBox="0 0 56 56"><title>Ripple</title><desc>Light spreads from the centre outward.</desc><defs><circle id="glyph-ripple-b" r="2.4" fill="#fff" opacity=".07"/><circle id="glyph-ripple-l" r="3.1"/></defs><style>@keyframes glyph-ripple-k{0%{opacity:.05}20%{opacity:1}55%{opacity:.18}}.glyph-ripple-l{fill:#fff;opacity:0;animation:glyph-ripple-k 2400ms cubic-bezier(.65,0,.35,1) infinite both}@media (prefers-reduced-motion:reduce){.glyph-ripple-l{animation:none;opacity:.45}}.glyph-ripple-d0{animation-delay:905ms}.glyph-ripple-d1{animation-delay:716ms}.glyph-ripple-d2{animation-delay:640ms}.glyph-ripple-d3{animation-delay:716ms}.glyph-ripple-d4{animation-delay:905ms}.glyph-ripple-d5{animation-delay:716ms}.glyph-ripple-d6{animation-delay:453ms}.glyph-ripple-d7{animation-delay:320ms}.glyph-ripple-d8{animation-delay:453ms}.glyph-ripple-d9{animation-delay:716ms}.glyph-ripple-d10{animation-delay:640ms}.glyph-ripple-d11{animation-delay:320ms}.glyph-ripple-d12{animation-delay:0ms}.glyph-ripple-d13{animation-delay:320ms}.glyph-ripple-d14{animation-delay:640ms}.glyph-ripple-d15{animation-delay:716ms}.glyph-ripple-d16{animation-delay:453ms}.glyph-ripple-d17{animation-delay:320ms}.glyph-ripple-d18{animation-delay:453ms}.glyph-ripple-d19{animation-delay:716ms}.glyph-ripple-d20{animation-delay:905ms}.glyph-ripple-d21{animation-delay:716ms}.glyph-ripple-d22{animation-delay:640ms}.glyph-ripple-d23{animation-delay:716ms}.glyph-ripple-d24{animation-delay:905ms}</style><use x="6" y="6" href="#glyph-ripple-b"/><use x="17" y="6" href="#glyph-ripple-b"/><use x="28" y="6" href="#glyph-ripple-b"/><use x="39" y="6" href="#glyph-ripple-b"/><use x="50" y="6" href="#glyph-ripple-b"/><use x="6" y="17" href="#glyph-ripple-b"/><use x="17" y="17" href="#glyph-ripple-b"/><use x="28" y="17" href="#glyph-ripple-b"/><use x="39" y="17" href="#glyph-ripple-b"/><use x="50" y="17" href="#glyph-ripple-b"/><use x="6" y="28" href="#glyph-ripp